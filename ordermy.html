<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORDR.MY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Syne:wght@800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080a;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f5f7fa;
      --muted: #8a93a6;
      --accent: #00f5d4;
      --accent-2: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Canvas & Spotlight */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .spotlight {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        650px circle at var(--mx, 50%) var(--my, 50%),
        rgba(0, 245, 212, 0.09),
        rgba(59, 130, 246, 0.04) 40%,
        transparent 75%
      );
      transition: opacity 0.3s ease;
    }

    /* Subtle Grain Overlay */
    .noise {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* Layout Container */
    .wrapper {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(1.25rem, 3vw, 2.5rem);
    }

    /* Top Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      color: var(--text);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }

    /* Center Hero */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      padding: 2rem 0;
    }

    .brand-stage {
      width: 100%;
      max-width: 1400px;
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Guaranteed Full Fit Across Any Screen Width */
    .brand-title {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      white-space: nowrap;
      font-family: 'Syne', 'Space Grotesk', sans-serif;
      font-weight: 800;
      /* Sized specifically so all 7 chars (ORDR.MY) always fit inside 92vw */
      font-size: clamp(2.6rem, 13.5vw, 13rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      user-select: none;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.18s ease-out;
    }

    .char {
      display: inline-block;
      position: relative;
      opacity: 0;
      transform: translateY(60px) rotateX(-45deg) scale(0.9);
      animation: revealChar 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--i) * 75ms);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), color 0.25s ease, text-shadow 0.25s ease;
    }

    /* Subtle continuous wave motion after entrance */
    .char.ready {
      opacity: 1;
      animation: floatWave 4.5s ease-in-out infinite;
      animation-delay: calc(var(--i) * 180ms);
    }

    .char:hover {
      transform: translateY(-16px) scale(1.06) !important;
      color: var(--accent);
      text-shadow: 0 12px 35px rgba(0, 245, 212, 0.45);
    }

    /* Unified Brand Highlight for .MY */
    .char.tld {
      background: linear-gradient(135deg, #ffffff 10%, var(--accent) 55%, var(--accent-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 28px rgba(0, 245, 212, 0.25));
    }

    .char.dot {
      color: var(--accent);
      -webkit-text-fill-color: var(--accent);
      padding: 0 0.02em;
    }

    @keyframes revealChar {
      to {
        opacity: 1;
        transform: translateY(0) rotateX(0deg) scale(1);
      }
    }

    @keyframes floatWave {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* Subcopy & Actions */
    .tagline {
      margin-top: clamp(1.25rem, 3vw, 2.25rem);
      font-size: clamp(0.95rem, 1.6vw, 1.2rem);
      color: var(--muted);
      max-width: 520px;
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.65s;
    }

    .actions {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      justify-content: center;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.8s;
    }

    .btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.22s ease;
      text-decoration: none;
    }

    .btn:hover {
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 700;
    }

    .btn-primary:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #041014;
      box-shadow: 0 10px 30px rgba(0, 245, 212, 0.3);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 1.25rem;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #11151c;
      border: 1px solid var(--accent);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      padding: 0.7rem 1.25rem;
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="spotlight" id="spotlight"></div>
  <div class="noise"></div>

  <div class="wrapper">
    <header>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span>ORDR.MY // LIVE</span>
      </div>
      <div>KUALA LUMPUR &bull; MY</div>
    </header>

    <main>
      <div class="brand-stage" id="stage">
        <h1 class="brand-title" id="brandText" aria-label="ORDR.MY" title="Click to copy ORDR.MY">
          <span class="char" style="--i:0">O</span><span class="char" style="--i:1">R</span><span class="char" style="--i:2">D</span><span class="char" style="--i:3">R</span><span class="char dot tld" style="--i:4">.</span><span class="char tld" style="--i:5">M</span><span class="char tld" style="--i:6">Y</span>
        </h1>
      </div>

      <p class="tagline">
        Next-generation ordering &amp; commerce infrastructure built for speed.
      </p>

      <div class="actions">
        <button class="btn btn-primary" id="copyBtn">COPY ORDR.MY</button>
        <a class="btn" href="mailto:hello@ordr.my">HELLO@ORDR.MY</a>
      </div>
    </main>

    <footer>
      <span>&copy; 2026 ORDR.MY</span>
      <span>ALL RIGHTS RESERVED</span>
    </footer>
  </div>

  <div class="toast" id="toast">Copied ORDR.MY to clipboard</div>

  <script>
    // Switch from entrance animation to continuous subtle wave float
    const chars = document.querySelectorAll('.char');
    setTimeout(() => {
      chars.forEach(c => c.classList.add('ready'));
    }, 1200);

    // 3D Tilt & Spotlight Tracking
    const spotlight = document.getElementById('spotlight');
    const brandText = document.getElementById('brandText');

    window.addEventListener('mousemove', (e) => {
      const x = e.clientX;
      const y = e.clientY;
      spotlight.style.setProperty('--mx', `${x}px`);
      spotlight.style.setProperty('--my', `${y}px`);

      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const rotateY = ((x - cx) / cx) * 8;
      const rotateX = -((y - cy) / cy) * 8;
      brandText.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    window.addEventListener('mouseleave', () => {
      brandText.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });

    // Copy ORDR.MY Action
    const toast = document.getElementById('toast');
    const copyDomain = () => {
      navigator.clipboard?.writeText('ORDR.MY');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    };

    document.getElementById('copyBtn').addEventListener('click', copyDomain);
    brandText.addEventListener('click', copyDomain);

    // Subtle Interactive Particle Grid Canvas
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles;

    function initCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      const count = Math.min(55, Math.floor((width * height) / 22000));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        r: Math.random() * 1.6 + 0.6
      }));
    }

    function drawCanvas() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(0, 245, 212, 0.35)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dx = p.x - p2.x;
          const dy = p.y - p2.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 130) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(drawCanvas);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    drawCanvas();
  </script>
</body>
</html>
